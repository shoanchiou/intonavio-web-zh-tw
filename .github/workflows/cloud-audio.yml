name: Render audio container
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-audio.yml"
      - ".dockerignore"
      - "Dockerfile.render"
      - "render.yaml"
      - "server/cloud-audio.mjs"
      - "server/youtube.mjs"
      - "tests/cloud-audio.test.mjs"

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --test tests/cloud-audio.test.mjs
      - run: docker build -f Dockerfile.render -t intonavio-audio .
      - run: |
          docker run --rm intonavio-audio yt-dlp --no-js-runtimes --js-runtimes node --version
          docker run --rm intonavio-audio ffmpeg -version
          docker run --rm intonavio-audio ffprobe -version
          name="$(docker run -d -p 127.0.0.1:10000:10000 -e INTONAVIO_CLOUD_TOKEN=isolated-ci-test-token-without-service-access intonavio-audio)"
          trap 'docker logs "$name"; docker rm -f "$name"' EXIT
          curl --fail --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:10000/health | grep intonavio-cloud-audio
